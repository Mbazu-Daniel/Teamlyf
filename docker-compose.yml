services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teamlyf-hack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teamlyf-hack"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - teamlyf-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - teamlyf-redis:/data

volumes:
  teamlyf-postgres:
  teamlyf-redis:
