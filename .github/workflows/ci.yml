name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - uses: fallow-rs/fallow@v3
        id: fallow
        with:
          command: audit
          format: human
          fail-on-issues: true
          comment: true
          annotations: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('fallow-results.sarif') != ''
        with:
          sarif_file: fallow-results.sarif

  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # An image only rebuilds when a file it actually packages changed. Shared
      # inputs (lockfile, workspace config) rebuild both. Docs-only pushes build
      # nothing but still deploy the webhook, so main/dev never diverge.
      - name: Compare against the previous commit
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "api=false" >> "$GITHUB_OUTPUT"
            echo "web=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only HEAD~1 HEAD)"
          echo "Changed files:"
          echo "$CHANGED"

          SHARED='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|\.dockerignore|\.github/workflows/ci\.yml)$'
          if echo "$CHANGED" | grep -qE "$SHARED"; then
            echo "Shared build input changed; both images rebuild."
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # apps/api and packages/db are both copied into the API image.
          if echo "$CHANGED" | grep -qE '^(apps/api/|packages/db/)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^apps/web/'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: Build and push API image
    needs: [ci, changes]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects capitals in a repository name and this repo is `Teamlyf`.
      # The bash expansion lowercases the whole path, so a rename cannot break it.
      - name: Lowercase repository name
        run: |
          REPO_LC=${GITHUB_REPOSITORY,,}
          echo "REPO=${REPO_LC}" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${REPO_LC##*/}" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged GHCR manifests
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5

      # A missing webhook fails here on purpose: the image is pushed but nothing
      # deploys it, and a silent skip hides that until someone checks Dokploy.
      - name: Trigger Dokploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_WEBHOOK_URL is not set; image pushed but nothing deployed"
            exit 1
          fi
          # Docker/GHCR apps need registry_package plus a matching tag. A bare
          # POST can return success while redeploying the cached local image.
          IMAGE="ghcr.io/${REPO}:${GITHUB_REF_NAME}"
          BODY=$(jq -nc \
            --arg url "$IMAGE" \
            --arg id "${GITHUB_SHA}" \
            --arg msg "CI deploy ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME})" \
            '{
              head_commit: {id: $id, message: $msg},
              registry_package: {package_version: {package_url: $url}}
            }')
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: registry_package" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          BODY_OUT=$(echo "$RESP" | sed '$d')
          echo "Dokploy response ($CODE) for $IMAGE: $BODY_OUT"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            exit 22
          fi

  deploy-web:
    name: Build and push web image
    needs: [ci, changes]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects capitals in a repository name and this repo is `Teamlyf`.
      # The owner comes from the repository so a fork deploys under its own
      # namespace; the package suffix is fixed at `teamlyf-client` so the
      # Dokploy app pins one stable value.
      - name: Lowercase repository name
        run: |
          REPO_LC=${GITHUB_REPOSITORY,,}
          echo "OWNER=${REPO_LC%%/*}" >> $GITHUB_ENV
          echo "IMAGE=ghcr.io/${REPO_LC%%/*}/teamlyf-client" >> $GITHUB_ENV

      - name: Resolve public env for branch
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "api_url=https://api.getteamlyf.com" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://api-dev.getteamlyf.com" >> "$GITHUB_OUTPUT"
          fi

      # A blank image reference builds `ghcr.io/:dev`, which is an invalid tag
      # and fails the whole push. Fail here with the name spelled out instead.
      - name: Guard image reference
        run: |
          if [ -z "${IMAGE}" ] || [ "${IMAGE}" = "ghcr.io//teamlyf-client" ]; then
            echo "::error::IMAGE resolved to '${IMAGE}'. Expected ghcr.io/<owner>/teamlyf-client."
            exit 1
          fi
          echo "Building ${IMAGE}:${GITHUB_REF_NAME}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VITE_* are inlined at build time, so they must be build args.
          build-args: |
            VITE_API_URL=${{ steps.env.outputs.api_url }}
            VITE_WS_URL=${{ steps.env.outputs.api_url }}
            VITE_LIVEKIT_URL=${{ vars.VITE_LIVEKIT_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged manifests
        uses: actions/delete-package-versions@v5
        with:
          package-name: teamlyf-client
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5

      # A missing webhook fails here on purpose: the image is pushed but nothing
      # deploys it, and a silent skip hides that until someone checks Dokploy.
      - name: Trigger Dokploy webhook
        env:
          DOKPLOY_WEB_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEB_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEB_WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_WEB_WEBHOOK_URL is not set; image pushed but nothing deployed"
            exit 1
          fi
          IMAGE="${IMAGE}:${GITHUB_REF_NAME}"
          BODY=$(jq -nc \
            --arg url "$IMAGE" \
            --arg id "${GITHUB_SHA}" \
            --arg msg "CI deploy ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME})" \
            '{
              head_commit: {id: $id, message: $msg},
              registry_package: {package_version: {package_url: $url}}
            }')
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "$DOKPLOY_WEB_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: registry_package" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          BODY_OUT=$(echo "$RESP" | sed '$d')
          echo "Dokploy response ($CODE) for $IMAGE: $BODY_OUT"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            exit 22
          fi
